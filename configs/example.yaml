project:
  name: Example PrimerForge Project
  version: 0.1.0

reference_taxon:
  rank: species
  name: Oreochromis niloticus

contrast_taxa:
  - rank: genus
    name: Oreochromis

  - rank: genus
    name: Sarotherodon

  - rank: genus
    name: Coptodon

marker:
