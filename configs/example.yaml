  include_partial_sequences: true
  max_records: 1000

ncbi:
  email: "your_email@example.com"
  api_key: ""

primer:
  min_length: 20
  max_length: 24
  min_tm: 58
  max_tm: 62
  min_gc: 40
  max_gc: 60
  min_product: 80
  max_product: 150
